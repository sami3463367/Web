<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My account — [[SHOP_NAME]]</title>
  <meta name="description" content="Sign in, create an account, track orders and manage your profile.">
  <meta name="theme-color" content="#0b5d3b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="account">
  <div class="announce">[[ANNOUNCEMENT]]</div>

  <header class="header">
    <div class="container header__in">
      <a class="brand" href="/" aria-label="Home">
        <span class="brand__logo">🛍️</span>
        <span>[[SHOP_NAME]]<small>PREMIUM BD SHOP</small></span>
      </a>
      <form class="header__search" data-search-form role="search" action="/shop">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="q" placeholder="Search products…" aria-label="Search products">
      </form>
      <div class="header__actions">
        <a class="icon-btn" href="/cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2.5 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H6.1"/></svg>
          <span class="cart-count" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-bottom:26px">
    <div class="page-head">
      <h1>My account</h1>
      <p>Sign in to see your orders, or track one as a guest.</p>
    </div>
    <div data-account-mount></div>
  </main>

  <nav class="bottomnav" aria-label="Primary">
    <a class="bnav" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</a>
    <a class="bnav" href="/shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1 13H5L4 7z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>Shop</a>
    <a class="bnav" href="/cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2.5 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H6.1"/></svg>Cart<span class="cart-count" hidden>0</span></a>
    <a class="bnav" href="/account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Account</a>
  </nav>

  <button class="fab-wa" type="button" aria-label="Order via WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C9.4 3 4 8.3 4 14.9c0 2.6.8 5 2.3 7L4 29l7.3-2.3c1.9 1 4 1.6 6.2 1.6h.1c6.6 0 12-5.3 12-11.9S22.6 3 16 3zm0 21.8c-2 0-3.9-.5-5.6-1.5l-.4-.2-4.3 1.3 1.4-4.2-.3-.4a9.7 9.7 0 0 1-1.5-5.2c0-5.4 4.5-9.8 10-9.8s10 4.4 10 9.8-4.5 10.2-9.3 10.2zm5.5-7.3c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.2-.6-.4z"/></svg>
    <span class="fab-label">Order on WhatsApp</span>
  </button>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
